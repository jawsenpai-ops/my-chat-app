<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Download the My Chat Android app.">
    <title>Download My Chat</title>
    <style>
      :root { color-scheme: light; font-family: Georgia, "Times New Roman", serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4efe7; color: #1d2b24; }
      main { width: min(92vw, 620px); padding: 56px 32px; text-align: center; background: #fffdf9; border: 1px solid #d8cdbd; box-shadow: 12px 12px 0 #d9e3d5; }
      .mark { margin: 0 auto 24px; width: 56px; height: 56px; display: grid; place-items: center; border-radius: 16px; background: #285943; color: #fffdf9; font-size: 28px; font-weight: bold; }
      h1 { margin: 0 0 12px; font-size: clamp(2.4rem, 8vw, 4.5rem); line-height: .95; font-weight: 500; }
      p { margin: 0 auto 28px; max-width: 420px; font: 1.05rem/1.6 Arial, sans-serif; color: #506057; }
      a { display: inline-block; padding: 14px 22px; background: #d56b3f; color: white; font: 700 1rem Arial, sans-serif; text-decoration: none; }
      a[aria-disabled="true"] { pointer-events: none; opacity: .5; }
      small { display: block; margin-top: 18px; font: .8rem/1.4 Arial, sans-serif; color: #68756d; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">M</div>
      <h1>My Chat</h1>
      <p>Private conversations, ready wherever you are.</p>
      <a id="download" href="#" aria-disabled="true" download>Download for Android</a>
      <small id="status">The production build link will appear here when the release is published.</small>
    </main>
    <script>
      const apkUrl = "https://expo.dev/accounts/vniya/projects/my-chat-mobile/builds/5be0db90-8847-4f5b-856e-b42453946c6b";
      const link = document.getElementById("download");
      const status = document.getElementById("status");
      if (!apkUrl.includes("YOUR-APK-URL")) {
        link.href = apkUrl;
        link.removeAttribute("aria-disabled");
        status.textContent = "Download the latest production Android build.";
      }
    </script>
  </body>
</html>
